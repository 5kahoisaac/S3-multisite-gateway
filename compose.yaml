services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    command:
      - caddy
      - reverse-proxy
      - --from
      - ":80"
      - --to
      - gateway:8080
    expose:
      - "80"
    depends_on:
      - gateway
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:80/_health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
